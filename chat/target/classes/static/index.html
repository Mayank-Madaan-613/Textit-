<!DOCTYPE html>
<html>
<head>
    <title>TextIt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        
        body {
            background-image:url(b.jpg); 
            background-size:cover;
            background-position:fixed;
            padding: 3rem;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        .chat-container {
            position:center;
            max-height:100vh; 
            backdrop-filter:blur(8px);
            border-radius: 3rem;
            overflow: hidden;
        }

        .chat-header {
            background-color: #2563eb; 
            padding: 1rem;
            color: white;
            font-weight: bold;
        }

        
        #messages {
            height: 26rem; 
            overflow-y:auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem; 
            font-size: 0.875rem;
        }

        
        .message-bubble {
            background-color: #e4eabc; 
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
       .message-bubble-self{
            background-color:pink;
            padding:0.5rem;
            border-radius:0.25rem;
        }

        
        .chat-footer {
            padding: 0.1rem 2rem 2rem 2rem;    
        }
        .input-box{
            display:flex;
            padding:0.2rem 0.5rem;
            flex-direction:row;
            align-items:center;
            gap:0.5rem;
            border:none;
            border-radius:10rem;
            background-color:white;
            box-shadow: 0px 0px 15px 6px rgba(0,0,0,0.3);
        }

        .chat-input {
            flex: 1;
            border:none;
            padding:1rem;
            outline: none;
            background-color:rgba(0, 0, 0, 0);
            transition:border-color 0.2s;
        }

        .chat-input:focus { 
            border-color:#81bbd4;
        }


        .send-button {
            display:flex;
            align-items: center;
            justify-content:center;
            background-color:rgb(165, 229, 245);
            border-radius: 10rem;
            width:4vw;
            height:6vh;
            border: none;
            cursor: pointer;
            transition-property: background-color;
            transition-duration:0.2s;
        }

        .attach{
            display:flex;
            align-items:center;
            justify-content:center;
            background-color:rgb(165, 229, 245);
            border:none;
            border-radius:100rem;
            width:3vw;
            height:6vh;
            cursor:pointer;
            transition-property:backgorund-color;
            transition-duration:0.2s;
        }


        #send-image{
            width:30px;
            height:35px;
        }
        #attach-image{
            width:25px;
            height:27px;
        }

        .send-button:hover {
            background-color:rgb(129,187,212);
        }
        .attach:hover{
            background-color:rgb(129,187,212);
        }
    </style>
</head>
<body>
    <div class="chat-container" id="drop-area">
        
        <div id="messages"></div>
        <div class="chat-footer" id="chat-footer">
            <div class="input-box">
                <input id="msg" type="text" class="chat-input" placeholder="Enter you message.....">
                <button class="attach" id="attach-btn"><img src="attach.png" id="attach-image"></button>
                <input type="file" id="fileinput" hidden>
                <button onclick="send()" class="send-button"><img src="send.png" id="send-image"></button>
            </div>
        </div>
    </div>

    <script>
        const attachbtn=document.getElementById("attach-btn");
        attachbtn.addEventListener("click", function(){
            fileinput.click();
        });
        var file=document.getElementById("fileinput")
        file.addEventListener("change",function(){
            var div =document.createElement('div');
            const selectedFile = fileinput.files[0];
            div.innerText=selectedFile.name;
            document.getElementById("chat-footer").appendChild(div);
        })
        const inp=document.getElementById("msg");
        inp.addEventListener("keydown",(event)=>{
            if(event.key==="Enter"){
                event.preventDefault();
                send();
                
            }
        })
        var stompClient = null;

        function connect() {
            var socket = new SockJS('/ws-bridge');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/topic/messages', function (msg) {
                    var div = document.createElement('div');
                    div.className = "message-bubble";
                    div.innerText = msg.body;
                    document.getElementById('messages').appendChild(div);
                    var msgDiv = document.getElementById('messages');
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                });
            });
        }

        function send(){
            var val = document.getElementById('msg').value;
            if(val.trim()!==""){
            var div=document.createElement('div');
            div.innerText=val;
            div.className="message-bubble-self";
            div.id="self-message";
            document.getElementById("messages").appendChild(div);
            var msgDiv = document.getElementById('messages');
            msgDiv.scrollTop = msgDiv.scrollHeight;
            stompClient.send("/app/chat.send", {}, val);
            document.getElementById('msg').value = '';
            }
        }
        connect();
    </script>
</body>
</html>
